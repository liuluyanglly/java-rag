databaseChangeLog:
  - changeSet:
      id: 05-reset-admin-password
      author: ragagent
      comment: >-
        修正超级管理员初始密码。02_init_data.yaml 写入的 BCrypt 密文与其注释声明的 admin123 并不匹配
        （该密文既非 admin123 也非 123456），导致初始账号无法登录。
        02 已执行过，直接改写会触发 Liquibase 校验和不一致，故以增量脚本重置为 admin123。
      changes:
        - sql:
            sql: |
              -- 密文由 cn.hutool.crypto.digest.BCrypt.hashpw("admin123") 生成，
              -- 与 SysUserServiceImpl.login 中的 BCrypt.checkpw 校验方式一致
              UPDATE sys_user
              SET password = '$2a$10$TExGCSCXDC7ADWgWlkT5OunsDHN.3dkOJOM85TnFI0l4WaP0fIfFe',
                  update_time = CURRENT_TIMESTAMP
              WHERE username = 'admin';
