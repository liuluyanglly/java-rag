<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 底座圆角矩形 -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- 科技光效与内边框 -->
  <rect x="5" y="5" width="54" height="54" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- 智能体拓扑连接线与节点 -->
  <path d="M22 45V20H35C39.4 20 43 23.6 43 28C43 31.8 40.3 35 36.7 35.8L44 45H36.5L30 36.5H27V45H22Z" fill="url(#glowGrad)" />
  <path d="M27 24.5V32H34.5C36.7 32 38.5 30.2 38.5 28C38.5 25.8 36.7 24.5 34.5 24.5H27Z" fill="#4f46e5" />

  <!-- 拓扑发光节点 -->
  <circle cx="45" cy="18" r="3" fill="#38bdf8" />
  <circle cx="45" cy="18" r="1.5" fill="#ffffff" />
  <line x1="39" y1="22" x2="43" y2="19.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" />
</svg>
